<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIVIAL BRUTAL - EL DESAFÍO</title>
    <style>
        :root {
            --bg: #08080a;
            --card: #12121a;
            --accent: #00f2ff;
            --success: #00ff88;
            --error: #ff3e3e;
            --gold: #ffcc00;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 500px;
            background: var(--card);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .screen { display: none; }
        .active { display: block; }

        /* HEADER */
        .header { text-align: center; margin-bottom: 20px; }
        .streak-fire { font-size: 1.5rem; color: #ff8800; font-weight: bold; }

        /* BOTONES */
        button {
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-main {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: black;
            font-weight: 900;
            border-radius: 12px;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .btn-main:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
        }

        /* TRIVIAL */
        .opt-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #1e1e2a;
            color: white;
            text-align: left;
            border-radius: 10px;
            border: 2px solid transparent;
        }

        .correct { background: var(--success) !important; color: black; font-weight: bold; }
        .wrong { background: var(--error) !important; }

        /* LEADERBOARD */
        .leaderboard-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        .leaderboard-table td { padding: 10px; border-bottom: 1px solid #222; }
        .rank { color: var(--gold); font-weight: bold; }

        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; background: #1e1e2a; border-radius: 8px; font-size: 0.8rem; text-align: center; cursor: pointer; }
        .tab.active-tab { background: var(--accent); color: black; }

    </style>
</head>
<body>

<div class="container">
    <div id="screen-home" class="screen active">
        <div class="header">
            <div class="streak-fire">🔥 RACHA: <span id="streak-num">0</span></div>
            <h1>TRIVIAL DIARIO</h1>
        </div>

        <button id="play-today-btn" class="btn-main" onclick="initGame('today')">JUGAR RETO HOY</button>
        <p id="already-played-msg" style="color: var(--error); display: none; text-align: center;">Ya has completado el reto de hoy.</p>

        <div style="margin-top: 30px;">
            <label style="font-size: 0.8rem; opacity: 0.7;">REPASAR CALENDARIO:</label>
            <input type="date" id="calendar-input" onchange="checkDateValid()" 
                   style="width:100%; padding:10px; background:#1e1e2a; border:1px solid var(--accent); color:white; border-radius:8px; margin-top:5px;">
        </div>

        <div style="margin-top: 30px;">
            <div class="tabs">
                <div class="tab active-tab" onclick="showLead('daily')">DIARIO</div>
                <div class="tab" onclick="showLead('streaks')">RACHAS</div>
            </div>
            <div id="leaderboard-content">
                <table class="leaderboard-table" id="lead-table">
                    </table>
            </div>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div id="timer" style="text-align: right; color: var(--accent); font-family: monospace;">00:00</div>
        <div class="progress-bar" style="height:4px; background:#222; margin: 15px 0;">
            <div id="progress-fill" style="height:100%; background:var(--accent); width:0%;"></div>
        </div>
        <h2 id="q-text">---</h2>
        <div id="options-box"></div>
    </div>

    <div id="screen-result" class="screen">
        <h2 style="text-align: center;">RESULTADO</h2>
        <div id="final-stats" style="font-size: 2rem; text-align: center; margin: 20px 0;"></div>
        <p id="final-time" style="text-align: center; opacity: 0.7;"></p>
        <button class="btn-main" onclick="location.reload()">VOLVER</button>
    </div>
</div>

<script>
    // CONFIGURACIÓN Y PREGUNTAS
    // Aquí pondrías tu banco masivo. El sistema elegirá 10 por día.
    const masterBank = [
        { q: "¿Qué país tiene más islas en el mundo?", o: ["Filipinas", "Indonesia", "Suecia", "Noruega"], a: 2 },
        { q: "¿Cuál es el elemento más abundante en el universo?", o: ["Oxígeno", "Hidrógeno", "Helio", "Carbono"], a: 1 },
        { q: "¿En qué año se lanzó el primer iPhone?", o: ["2005", "2008", "2007", "2009"], a: 2 },
        // ... Imagina 1000 preguntas aquí
    ];

    // Lógica para que el calendario no pase de hoy
    const inputDate = document.getElementById('calendar-input');
    const hoy = new Date().toISOString().split("T")[0];
    inputDate.max = hoy;

    let startTime, timerInterval;
    let score = 0;
    let currentStep = 0;
    let dailyQuestions = [];
    let isRetroactive = false;

    // --- SISTEMA DE GESTIÓN DE DÍAS ---
    function checkAlreadyPlayed() {
        const history = JSON.parse(localStorage.getItem('triviaHistory') || "{}");
        if(history[hoy]) {
            document.getElementById('play-today-btn').disabled = true;
            document.getElementById('already-played-msg').style.display = "block";
        }
        document.getElementById('streak-num').innerText = localStorage.getItem('userStreak') || 0;
    }

    function initGame(mode) {
        let selectedDate;
        if(mode === 'today') {
            selectedDate = hoy;
            isRetroactive = false;
        } else {
            selectedDate = document.getElementById('calendar-input').value;
            isRetroactive = true;
        }

        // Semilla matemática basada en la fecha para elegir 10 preguntas
        const seed = selectedDate.split("-").join("");
        dailyQuestions = getDailySet(seed);
        
        showScreen('screen-game');
        startTimer();
        loadQuestion();
    }

    function getDailySet(seed) {
        // Esta lógica asegura que CADA DÍA las preguntas sean distintas
        // pero SIEMPRE las mismas para ese día específico.
        let result = [];
        let tempBank = [...masterBank];
        let s = parseInt(seed);
        
        for(let i=0; i<10; i++) {
            let index = (s + (i * 13)) % tempBank.length;
            result.push(tempBank[index]);
        }
        return result;
    }

    function loadQuestion() {
        const q = dailyQuestions[currentStep];
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('progress-fill').style.width = `${(currentStep/10)*100}%`;
        
        const box = document.getElementById('options-box');
        box.innerHTML = '';

        q.o.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = opt;
            b.onclick = () => handleAnswer(i, q.a, b);
            box.appendChild(b);
        });
    }

    function handleAnswer(choice, correct, btn) {
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.disabled = true);

        if(choice === correct) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            allBtns[correct].classList.add('correct');
        }

        setTimeout(() => {
            currentStep++;
            if(currentStep < 10) loadQuestion();
            else finishGame();
        }, 1000);
    }

    function finishGame() {
        clearInterval(timerInterval);
        const finalTime = document.getElementById('timer').innerText;
        showScreen('screen-result');
        document.getElementById('final-stats').innerText = `${score}/10`;
        document.getElementById('final-time').innerText = `Tiempo: ${finalTime}`;

        if(!isRetroactive) {
            saveTodayResult(score, finalTime);
        }
    }

    function saveTodayResult(points, time) {
        // Guardar que hoy ya se jugó
        const history = JSON.parse(localStorage.getItem('triviaHistory') || "{}");
        history[hoy] = { points, time };
        localStorage.setItem('triviaHistory', JSON.stringify(history));

        // Lógica de Racha
        let streak = parseInt(localStorage.getItem('userStreak') || 0);
        let lastDate = localStorage.getItem('lastDatePlayed');
        
        const ayer = new Date();
        ayer.setDate(ayer.getDate() - 1);
        const ayerStr = ayer.toISOString().split("T")[0];

        if(lastDate === ayerStr) {
            streak++;
        } else if(lastDate !== hoy) {
            streak = 1;
        }
        
        localStorage.setItem('userStreak', streak);
        localStorage.setItem('lastDatePlayed', hoy);
    }

    // --- UTILIDADES ---
    function startTimer() {
        startTime = Date.now();
        timerInterval = setInterval(() => {
            let diff = Date.now() - startTime;
            let m = Math.floor(diff / 60000);
            let s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer').innerText = 
                `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }, 1000);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showLead(type) {
        const table = document.getElementById('lead-table');
        if(type === 'daily') {
            table.innerHTML = `
                <tr><td><span class="rank">#1</span> Juan_88</td><td>10/10</td><td>00:42s</td></tr>
                <tr><td><span class="rank">#2</span> TrivialKing</td><td>10/10</td><td>00:55s</td></tr>
                <tr><td><span class="rank">#3</span> Tu_Nombre</td><td>${score}/10</td><td>--</td></tr>
            `;
        } else {
            table.innerHTML = `
                <tr><td><span class="rank">#1</span> AlexPro</td><td>🔥 45 días</td></tr>
                <tr><td><span class="rank">#2</span> Maria99</td><td>🔥 32 días</td></tr>
            `;
        }
    }

    checkAlreadyPlayed();
    showLead('daily');

</script>
</body>
</html>
