<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIVIAL BRUTAL - COMPETICIÓN</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card: #16161e;
            --accent: #00f2ff;
            --success: #00ff88;
            --error: #ff3e3e;
            --gold: #ffcc00;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 500px;
            background: var(--card);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* INPUTS Y BOTONES */
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .btn-main {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: black;
            font-weight: 900;
            border: none;
            border-radius: 12px;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-main:disabled { background: #333; cursor: not-allowed; }

        /* JUEGO */
        .opt-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #1e1e2a;
            color: white;
            text-align: left;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .correct { background: var(--success) !important; color: black; font-weight: bold; }
        .wrong { background: var(--error) !important; }

        /* RANKING */
        .leaderboard { margin-top: 20px; background: #000; border-radius: 12px; padding: 15px; }
        .entry { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .rank { color: var(--gold); margin-right: 10px; }

        .streak-fire { color: #ff8800; font-weight: bold; text-align: center; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-auth" class="screen">
        <h1>Bienvenido</h1>
        <p>Introduce tu nombre de guerrero para el Ranking:</p>
        <input type="text" id="username-input" placeholder="Ej: TrivialMaster_99">
        <button class="btn-main" onclick="saveName()">GUARDAR Y CONTINUAR</button>
    </div>

    <div id="screen-home" class="screen">
        <div class="streak-fire">🔥 RACHA: <span id="streak-num">0</span> DÍAS</div>
        <h1 style="text-align: center;">TRIVIAL BRUTAL</h1>
        <p id="welcome-user" style="text-align: center; opacity: 0.7;"></p>

        <button id="play-today-btn" class="btn-main" onclick="initGame('today')">JUGAR RETO HOY</button>
        
        <div style="margin-top: 25px;">
            <label style="font-size: 0.8rem;">REPASAR DÍAS PASADOS:</label>
            <input type="date" id="calendar-input" onchange="checkDateValid()">
        </div>

        <div class="leaderboard">
            <h3 style="margin-top: 0; color: var(--accent);">RANKING LOCAL (Top 5)</h3>
            <div id="lead-list"></div>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div style="display: flex; justify-content: space-between;">
            <span id="q-count">1/10</span>
            <span id="timer" style="color: var(--accent); font-family: monospace;">00:00</span>
        </div>
        <h2 id="q-text" style="min-height: 80px; margin-top: 20px;">---</h2>
        <div id="options-box"></div>
    </div>

    <div id="screen-result" class="screen">
        <h2 style="text-align: center;">FIN DEL DESAFÍO</h2>
        <div id="final-stats" style="font-size: 3rem; text-align: center; color: var(--accent);">0/10</div>
        <p id="final-time" style="text-align: center; opacity: 0.8;"></p>
        <button class="btn-main" onclick="location.reload()">VOLVER AL MENÚ</button>
    </div>
</div>

<script>
    const masterBank = [
        { q: "¿En qué año llegó el hombre a la Luna?", o: ["1965", "1969", "1971", "1962"], a: 1 },
        { q: "¿Cuál es el país más pequeño del mundo?", o: ["Mónaco", "Malta", "Vaticano", "San Marino"], a: 2 },
        { q: "¿Qué gas es vital para respirar?", o: ["Nitrógeno", "Helio", "Oxígeno", "Argón"], a: 2 },
        { q: "¿Cuál es el río más largo de España?", o: ["Ebro", "Tajo", "Duero", "Guadalquivir"], a: 1 },
        { q: "¿Quién pintó 'La última cena'?", o: ["Miguel Ángel", "Rafael", "Leonardo da Vinci", "Donatello"], a: 2 },
        { q: "¿Cuál es el metal más ligero?", o: ["Litio", "Aluminio", "Cobre", "Plomo"], a: 0 },
        { q: "¿En qué continente está el desierto del Sáhara?", o: ["Asia", "África", "América", "Oceanía"], a: 1 },
        { q: "¿Qué idioma se habla en Brasil?", o: ["Español", "Portugués", "Inglés", "Francés"], a: 1 },
        { q: "¿Cuál es la capital de Italia?", o: ["Milán", "Nápoles", "Roma", "Venecia"], a: 2 },
        { q: "¿Qué planeta es el 'Planeta Rojo'?", o: ["Venus", "Marte", "Júpiter", "Saturno"], a: 1 },
        { q: "¿Quién escribió Don Quijote?", o: ["Lope de Vega", "Quevedo", "Cervantes", "Góngora"], a: 2 }
    ];

    const hoy = new Date().toISOString().split("T")[0];
    let startTime, timerInterval, currentQuestions = [], currentStep = 0, score = 0, playingDate = "";

    // 1. GESTIÓN DE IDENTIDAD
    function checkAuth() {
        const name = localStorage.getItem('triviaUser');
        if (!name) {
            showScreen('screen-auth');
        } else {
            showScreen('screen-home');
            document.getElementById('welcome-user').innerText = `Hola, ${name}`;
            renderLeaderboard();
            checkTodayStatus();
        }
    }

    function saveName() {
        const val = document.getElementById('username-input').value.trim();
        if (val.length > 2) {
            localStorage.setItem('triviaUser', val);
            checkAuth();
        } else {
            alert("Nombre demasiado corto");
        }
    }

    // 2. LÓGICA DE JUEGO
    function initGame(mode) {
        playingDate = (mode === 'today') ? hoy : document.getElementById('calendar-input').value;
        if (!playingDate) return alert("Selecciona una fecha");

        const seed = playingDate.split("-").join("");
        currentQuestions = getDailySet(seed);
        currentStep = 0; score = 0;
        
        showScreen('screen-game');
        startTimer();
        loadQuestion();
    }

    function getDailySet(seed) {
        let set = [];
        let tempBank = [...masterBank];
        let s = parseInt(seed);
        for(let i=0; i<10; i++) {
            let index = (s + (i * 17)) % tempBank.length;
            set.push(tempBank[index]);
        }
        return set;
    }

    function loadQuestion() {
        const q = currentQuestions[currentStep];
        document.getElementById('q-count').innerText = `${currentStep + 1}/10`;
        document.getElementById('q-text').innerText = q.q;
        const box = document.getElementById('options-box');
        box.innerHTML = '';

        q.o.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = opt;
            b.onclick = () => {
                if(document.querySelector('.correct')) return;
                if(i === q.a) { b.classList.add('correct'); score++; }
                else { b.classList.add('wrong'); document.querySelectorAll('.opt-btn')[q.a].classList.add('correct'); }
                
                setTimeout(() => {
                    currentStep++;
                    if(currentStep < 10) loadQuestion();
                    else finishGame();
                }, 1000);
            };
            box.appendChild(b);
        });
    }

    function finishGame() {
        clearInterval(timerInterval);
        const timeStr = document.getElementById('timer').innerText;
        showScreen('screen-result');
        document.getElementById('final-stats').innerText = `${score}/10`;
        document.getElementById('final-time').innerText = `Tiempo: ${timeStr}`;

        if(playingDate === hoy) {
            saveResult(score, timeStr);
            updateStreak();
        }
    }

    // 3. RANKING Y RACHA
    function saveResult(pts, time) {
        const name = localStorage.getItem('triviaUser');
        let ranks = JSON.parse(localStorage.getItem('triviaRanks') || "[]");
        
        // Evitar duplicados del mismo día
        const alreadyPlayedToday = ranks.some(r => r.date === hoy && r.user === name);
        if(!alreadyPlayedToday) {
            ranks.push({ user: name, points: pts, time: time, date: hoy });
            // Ordenar: Más puntos, si empatan, menos tiempo
            ranks.sort((a,b) => b.points - a.points || a.time.localeCompare(b.time));
            localStorage.setItem('triviaRanks', JSON.stringify(ranks));
        }
        localStorage.setItem('lastPlayed_' + hoy, 'true');
    }

    function updateStreak() {
        let streak = parseInt(localStorage.getItem('userStreak') || 0);
        let lastDate = localStorage.getItem('lastDatePlayed');
        const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
        const ayerStr = ayer.toISOString().split("T")[0];

        if(lastDate === ayerStr) streak++;
        else if(lastDate !== hoy) streak = 1;

        localStorage.setItem('userStreak', streak);
        localStorage.setItem('lastDatePlayed', hoy);
    }

    function renderLeaderboard() {
        const ranks = JSON.parse(localStorage.getItem('triviaRanks') || "[]");
        const list = document.getElementById('lead-list');
        list.innerHTML = ranks.slice(0, 5).map((r, i) => `
            <div class="entry">
                <span><b class="rank">#${i+1}</b> ${r.user}</span>
                <span>${r.points}/10 <small>(${r.time})</small></span>
            </div>
        `).join('') || '<p style="font-size:0.8rem; opacity:0.5;">No hay récords hoy.</p>';
        
        document.getElementById('streak-num').innerText = localStorage.getItem('userStreak') || 0;
    }

    function checkTodayStatus() {
        if(localStorage.getItem('lastPlayed_' + hoy)) {
            document.getElementById('play-today-btn').disabled = true;
            document.getElementById('play-today-btn').innerText = "RETO COMPLETADO";
        }
        document.getElementById('calendar-input').max = hoy;
    }

    function startTimer() {
        let start = Date.now();
        timerInterval = setInterval(() => {
            let diff = Date.now() - start;
            let m = Math.floor(diff / 60000);
            let s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }, 1000);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    checkAuth();
</script>

</body>
</html>
