<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIVIAL DIARIO BRUTAL</title>
    <style>
        /* CSS: ESTILO BRUTAL Y MODERNO */
        :root {
            --bg: #0a0a0c;
            --card: #15151e;
            --accent: #00f2ff; /* Neón Cyan */
            --error: #ff2e63;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 255, 0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .date-tag {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-bottom: 30px;
            display: block;
        }

        #question-text {
            font-size: 1.2rem;
            line-height: 1.4;
            margin-bottom: 25px;
            min-height: 70px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        button:hover {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        button:active { transform: translateY(0); }

        .hidden { display: none; }

        #result-screen h2 { color: var(--accent); }
        
        .score-circle {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            color: var(--accent);
        }

        .share-btn {
            background: var(--accent);
            color: black;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-ui">
        <h1>Trivial Diario</h1>
        <span class="date-tag" id="date-display"></span>
        
        <div id="quiz-content">
            <p id="question-text">Preparando el desafío...</p>
            <div id="options-container" class="options-grid"></div>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>DESAFÍO COMPLETADO</h2>
        <div class="score-circle" id="score-number">0</div>
        <p id="result-msg"></p>
        <button class="share-btn" onclick="shareResult()">COMPARTIR RESULTADO</button>
        <p style="font-size: 0.7rem; margin-top: 20px; opacity: 0.5;">Vuelve mañana para un nuevo reto.</p>
    </div>
</div>

<script>
    // 1. BASE DE DATOS DE PREGUNTAS (Añade todas las que quieras)
    const questionsBank = [
        { q: "¿Qué país tiene más pirámides del mundo?", o: ["Egipto", "Sudán", "México", "Perú"], a: 1 },
        { q: "¿Cuál es el único metal que es líquido a temperatura ambiente?", o: ["Galio", "Cesio", "Mercurio", "Magnesio"], a: 2 },
        { q: "¿En qué año se hundió el Titanic?", o: ["1912", "1905", "1921", "1898"], a: 0 },
        { q: "¿Qué animal produce la leche de color rosa?", o: ["Ornitorrinco", "Hipopótamo", "Cerdo", "Flamenco"], a: 1 },
        { q: "¿Cuál es el lugar más profundo de la Tierra?", o: ["Fosa de las Marianas", "Gran Cañón", "Abismo de Bentley", "Fosa de Java"], a: 0 },
        { q: "¿Qué gas absorben las plantas y expulsan oxígeno?", o: ["Nitrógeno", "Metano", "Dióxido de Carbono", "Hidrógeno"], a: 2 },
        { q: "¿Cuál es el libro más vendido de la historia (después de la Biblia)?", o: ["Harry Potter", "Don Quijote de la Mancha", "El Principito", "Historia de dos ciudades"], a: 1 }
    ];

    // 2. LÓGICA DIARIA
    // Usamos la fecha actual como "semilla" para elegir preguntas
    const now = new Date();
    const dateString = now.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('date-display').innerText = dateString;

    // Generamos un índice basado en el día del año
    const startOfYear = new Date(now.getFullYear(), 0, 0);
    const diff = now - startOfYear;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));

    // Seleccionamos 3 preguntas usando el día del año como offset
    let dailyIndices = [
        (dayOfYear) % questionsBank.length,
        (dayOfYear + 1) % questionsBank.length,
        (dayOfYear + 2) % questionsBank.length
    ];
    
    // Eliminar duplicados si el banco es muy pequeño
    dailyIndices = [...new Set(dailyIndices)];

    let currentStep = 0;
    let score = 0;

    function initQuiz() {
        showQuestion();
    }

    function showQuestion() {
        const qData = questionsBank[dailyIndices[currentStep]];
        document.getElementById('question-text').innerText = qData.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        qData.o.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        if (selected === questionsBank[dailyIndices[currentStep]].a) {
            score++;
        }

        currentStep++;
        if (currentStep < dailyIndices.length) {
            showQuestion();
        } else {
            showFinalResults();
        }
    }

    function showFinalResults() {
        document.getElementById('quiz-ui').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('score-number').innerText = `${score}/${dailyIndices.length}`;
        
        let msg = "";
        if(score === dailyIndices.length) msg = "¡Nivel de genio absoluto! 🧠";
        else if(score > 0) msg = "Nada mal, pero puedes mejorar. 🔥";
        else msg = "Hoy no es tu día... ¡Vuelve mañana! 💀";
        
        document.getElementById('result-msg').innerText = msg;
    }

    function shareResult() {
        const text = `He completado el Trivial Diario (${score}/${dailyIndices.length}). ¿Te atreves? 🏆`;
        if (navigator.share) {
            navigator.share({ title: 'Trivial Diario', text: text, url: window.location.href });
        } else {
            alert("Copiado al portapapeles: " + text);
        }
    }

    initQuiz();
</script>

</body>
</html>
